plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tankdefense.game'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.tankdefense.game'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '6.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
